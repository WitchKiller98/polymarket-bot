[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "polymarket-bot"
version = "0.1.0"
description = "Latency arbitrage bot for Polymarket binary contracts"
requires-python = ">=3.11"
dependencies = [
    "aiohttp>=3.9.5",
    "websockets>=12.0",
    "asyncio-throttle>=1.0.2",
    "py-clob-client>=0.18.0",
    "python-telegram-bot>=21.3",
    "python-dotenv>=1.0.1",
    "aiosqlite>=0.20.0",
    "orjson>=3.10.5",
]

[project.scripts]
polybot = "main:main"
